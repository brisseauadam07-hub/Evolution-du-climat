<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulateur Climatique - Fichiers TXT Uniques</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 1300px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 5px; }
        .controls { display: flex; justify-content: center; gap: 15px; align-items: center; background: #eef2f3; padding: 15px; border-radius: 8px; margin-bottom: 25px; }
        select { padding: 10px 18px; font-size: 16px; border-radius: 6px; border: 1px solid #bdc3c7; background: white; cursor: pointer; }
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
        .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 20px; }
        .full-width { grid-column: span 2; }
        .canvas-container { position: relative; width: 100%; height: 350px; }
        .loading-status { text-align: center; color: #d35400; font-weight: bold; margin-bottom: 15px; padding: 10px; background: #fff3cd; border-radius: 6px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Simulateur Climatique Simplifié</h1>
    
    <div id="loadingStatus" class="loading-status">Chargement de "fossil.emissions.txt" et "land.use.emissions.txt"...</div>

    <div class="controls">
        <label for="scenarioSelect"><strong>Scénario d'analyse ciblé : </strong></label>
        <select id="scenarioSelect" onchange="updateDashboard()" disabled>
            <option value="RCP2.6">RCP 2.6 (Transition agressive)</option>
            <option value="RCP4.5" selected>RCP 4.5 (Stabilisation modérée)</option>
            <option value="RCP6">RCP 6.0 (Stabilisation tardive)</option>
            <option value="RCP8.5">RCP 8.5 (Scénario extrême)</option>
        </select>
    </div>

    <div class="dashboard">
        <div class="card full-width">
            <h3 style="text-align:center;">Émissions Fossiles Globales (GtC)</h3>
            <div class="canvas-container">
                <canvas id="chartFossilDF"></canvas>
            </div>
        </div>

        <div class="card full-width">
            <h3 style="text-align:center;">Émissions Usage des Sols (GtC)</h3>
            <div class="canvas-container">
                <canvas id="chartLandDF"></canvas>
            </div>
        </div>

        <div class="card">
            <h3 style="text-align:center;">Concentration en CO₂ Atmosphérique</h3>
            <div class="canvas-container">
                <canvas id="chartCO2Combined"></canvas>
            </div>
        </div>

        <div class="card">
            <h3 style="text-align:center;">Anomalie de Température Globale</h3>
            <div class="canvas-container">
                <canvas id="chartTempCombined"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
    const startYear = 1750;
    const endYear = 2100;
    const dt = 1;
    const CO2_preindustrial = 280;
    const Tatm_initial = 288.15;
    const Toc_initial = 283.0;
    
    // Constantes de conversion et modèle
    const m_atmosphere = 5.1352e18;
    const M_CO2 = 44.01; const M_C = 12.01; const M_air = 28.97;
    const ppm_to_gtc = (m_atmosphere * (M_CO2 / M_air) * 1e-6 * (M_C / M_CO2)) / 1e12;
    const K_aero = -0.7; const K_CO2 = 3.7; const tau_clim = 7; const S = 0.6;
    const tau_AS = 50;

    const scenarios = ["RCP2.6", "RCP4.5", "RCP6", "RCP8.5"];
    const colors = { 'RCP2.6': '#3b82f6', 'RCP4.5': '#10b981', 'RCP6': '#f59e0b', 'RCP8.5': '#ef4444' };
    
    let years = [];
    for (let y = startYear; y <= endYear; y++) years.push(y);

    // Initialisation des structures de données vides
    let dataTables = {
        dbFossil: { "RCP2.6": [], "RCP4.5": [], "RCP6": [], "RCP8.5": [] },
        dbLand: { "RCP2.6": [], "RCP4.5": [], "RCP6": [], "RCP8.5": [] }
    };

    // --- PARSER DYNAMIQUE POUR TES DEUX FICHIERS TXT ---
    async function loadDataFromTxtFiles() {
        try {
            // 1. Lecture du fichier fossile
            let respFossil = await fetch('fossil.emissions.txt');
            let textFossil = await respFossil.text();
            parseTxtToDatabase(textFossil, dataTables.dbFossil);

            // 2. Lecture du fichier land use
            let respLand = await fetch('land.use.emissions.txt');
            let textLand = await respLand.text();
            parseTxtToDatabase(textLand, dataTables.dbLand);

            // Masquer le statut de chargement et débloquer le sélecteur
            document.getElementById('loadingStatus').style.display = 'none';
            document.getElementById('scenarioSelect').disabled = false;

            initCharts();
            updateDashboard();

        } catch (error) {
            document.getElementById('loadingStatus').innerText = "Erreur : Impossible de lire 'fossil.emissions.txt' ou 'land.use.emissions.txt'. Lance un serveur local !";
            console.error(error);
        }
    }

    function parseTxtToDatabase(rawText, targetDb) {
        let lines = rawText.split('\n');
        let yearIndex = 0;

        for (let line of lines) {
            let cleanLine = line.trim();
            if (cleanLine === "" || cleanLine.startsWith('#')) continue; // Ignore les lignes vides ou commentaires

            // Sépare la ligne par n'importe quel espace, tabulation ou virgule
            let tokens = cleanLine.split(/[\s,;\t]+/).map(Number);
            
            // Si la ligne comporte 5 colonnes (Année + 4 scénarios), la première colonne est l'année
            let values = tokens.length >= 5 ? tokens.slice(1) : tokens;

            if (yearIndex < years.length && values.length >= 4) {
                let currentYear = years[yearIndex];
                targetDb["RCP2.6"].push({ x: currentYear, y: values[0] });
                targetDb["RCP4.5"].push({ x: currentYear, y: values[1] });
                targetDb["RCP6"].push({ x: currentYear, y: values[2] });
                targetDb["RCP8.5"].push({ x: currentYear, y: values[3] });
                yearIndex++;
            }
        }
    }

    // --- LE MOTEUR PHYSIQUE ---
    function runModel(scenario) {
        let CO2_levels = new Array(years.length);
        let Tatm_levels = new Array(years.length);
        CO2_levels[0] = CO2_preindustrial;
        Tatm_levels[0] = Tatm_initial;
        let pCO2_ocean = CO2_preindustrial;

        for (let i = 1; i < years.length; i++) {
            // Utilisation directe des valeurs extraites de tes fichiers textes
            let em_fossil = dataTables.dbFossil[scenario][i-1].y;
            let em_land = dataTables.dbLand[scenario][i-1].y;
            
            let em_total_gtc = em_fossil + em_land;
            let em_ppm = em_total_gtc / ppm_to_gtc;

            let delta_CO2 = CO2_levels[i-1] - pCO2_ocean;
            let flux_ocean = (delta_CO2 / tau_AS) * dt;

            CO2_levels[i] = CO2_levels[i-1] + em_ppm * dt - flux_ocean;
            if (CO2_levels[i] < CO2_preindustrial) CO2_levels[i] = CO2_preindustrial;

            let F_CO2 = K_CO2 * (Math.log(CO2_levels[i] / CO2_preindustrial) / Math.log(2));
            let F_aero = K_aero * (em_fossil / 10.0);
            
            Tatm_levels[i] = Tatm_levels[i-1] + S * (F_CO2 + F_aero) * (dt / tau_clim);
        }
        return { CO2_levels, Tatm_levels };
    }

    let charts = {};
    function initCharts() {
        const commonOptions = { responsive: true, maintainAspectRatio: false, scales: { x: { type: 'linear', min: 1750, max: 2100 } } };
        charts.fossilDF = new Chart(document.getElementById('chartFossilDF').getContext('2d'), { type: 'line', data: { datasets: [] }, options: commonOptions });
        charts.landDF = new Chart(document.getElementById('chartLandDF').getContext('2d'), { type: 'line', data: { datasets: [] }, options: commonOptions });
        charts.co2Combined = new Chart(document.getElementById('chartCO2Combined').getContext('2d'), { type: 'line', data: { datasets: [] }, options: commonOptions });
        charts.tempCombined = new Chart(document.getElementById('chartTempCombined').getContext('2d'), { type: 'line', data: { datasets: [] }, options: commonOptions });
    }

    function updateDashboard() {
        let activeScenario = document.getElementById('scenarioSelect').value;
        let allData = {};
        scenarios.forEach(scen => { allData[scen] = runModel(scen); });

        // Rendu des graphiques d'émissions (Fossile & Sols) issus de tes fichiers .txt
        charts.fossilDF.data.datasets = scenarios.map(scen => ({
            label: `Émissions ${scen}`, data: dataTables.dbFossil[scen], borderColor: colors[scen], borderWidth: scen === activeScenario ? 3 : 1, pointRadius: 0
        }));
        charts.fossilDF.update();

        charts.landDF.data.datasets = scenarios.map(scen => ({
            label: `Usage des Sols ${scen}`, data: dataTables.dbLand[scen], borderColor: colors[scen], borderWidth: scen === activeScenario ? 3 : 1, pointRadius: 0
        }));
        charts.landDF.update();

        // Rendu des résultats physiques calculés
        charts.co2Combined.data.datasets = scenarios.map(scen => ({
            label: `CO₂ ${scen}`, data: years.map((y, idx) => ({ x: y, y: allData[scen].CO2_levels[idx] })), borderColor: colors[scen], pointRadius: 0
        }));
        charts.co2Combined.update();

        charts.tempCombined.data.datasets = scenarios.map(scen => ({
            label: `T° ${scen}`, data: years.map((y, idx) => ({ x: y, y: allData[scen].Tatm_levels[idx] - Tatm_initial })), borderColor: colors[scen], pointRadius: 0
        }));
        charts.tempCombined.update();
    }

    window.onload = function() {
        loadDataFromTxtFiles();
    };
</script>
</body>
</html>
